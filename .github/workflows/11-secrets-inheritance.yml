# =============================================================================
# 11 - Secrets Inheritance & Management
# =============================================================================
# SCHOLAR NOTE:
#   Understanding secrets is critical for secure CI/CD. This workflow teaches:
#   1. How secrets are set at different levels (org, repo, environment)
#   2. Precedence rules when secrets have the same name
#   3. How GITHUB_TOKEN works and its automatic permissions
#   4. How secrets are passed to reusable workflows
#   5. How environment protection rules gate secret access
#   6. Security best practices for secret management
#
# SECRET HIERARCHY (highest to lowest precedence):
#   1. Environment secrets    - Tied to a specific environment
#   2. Repository secrets     - Available to all workflows in the repo
#   3. Organization secrets   - Shared across selected/all repos in the org
#
# When the same secret name exists at multiple levels, the most specific
# level wins. Environment > Repository > Organization.
#
# IMPORTANT SECURITY RULES:
#   - Secrets are NOT available in forked PR workflows (pull_request event)
#   - Secrets ARE available in pull_request_target (security risk!)
#   - Secrets are masked in logs (but can be leaked via encoding tricks)
#   - Secrets cannot be read in `if:` conditions directly
#   - Secrets are limited to 48KB in size
#   - A repository can have up to 1,000 secrets
#   - An organization can have up to 1,000 secrets
#   - An environment can have up to 1,000 secrets
# =============================================================================

name: "11 - Secrets Inheritance & Management"

on:
  workflow_dispatch:
    inputs:
      target-environment:
        description: "Which environment to deploy to"
        type: choice
        options:
          - development
          - staging
          - production
        default: development
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Understanding GITHUB_TOKEN
  # ---------------------------------------------------------------------------
  # GITHUB_TOKEN is an automatically generated token for each workflow run.
  # It is NOT a secret you create - GitHub creates it for each run.
  #
  # Key characteristics:
  #   - Scoped to the current repository only
  #   - Expires when the job completes
  #   - Permissions controlled by the `permissions` key in the workflow
  #   - Default permissions can be set in repo Settings > Actions > General
  #   - Two default modes: "read all" or "read contents + metadata only"
  #   - Can be referenced as secrets.GITHUB_TOKEN or github.token
  # ---------------------------------------------------------------------------
  github-token-explained:
    name: "GITHUB_TOKEN Deep Dive"
    runs-on: ubuntu-latest

    # PERMISSIONS REFERENCE:
    # These control what GITHUB_TOKEN can do.
    # Available scopes and their values:
    #   actions:             read/write - Manage GitHub Actions
    #   checks:              read/write - Create check runs/suites
    #   contents:            read/write - Repository contents, commits, branches
    #   deployments:         read/write - Deployment statuses
    #   discussions:         read/write - GitHub Discussions
    #   id-token:            write      - OIDC token for cloud authentication
    #   issues:              read/write - Issues and comments
    #   packages:            read/write - GitHub Packages
    #   pages:               read/write - GitHub Pages
    #   pull-requests:       read/write - Pull requests and reviews
    #   repository-projects: read/write - Project boards
    #   security-events:     read/write - Code scanning, secret scanning
    #   statuses:            read/write - Commit statuses
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: "GITHUB_TOKEN characteristics"
        run: |
          echo "=== GITHUB_TOKEN CHARACTERISTICS ==="
          echo ""
          echo "1. AUTOMATIC: Created by GitHub for each workflow run"
          echo "2. SCOPED: Only works for this repository (${{ github.repository }})"
          echo "3. EPHEMERAL: Expires when the job completes"
          echo "4. CONFIGURABLE: Permissions set via 'permissions' key"
          echo ""
          echo "=== ACCESSING THE TOKEN ==="
          echo "Two equivalent ways:"
          echo '  1. ${{ secrets.GITHUB_TOKEN }}'
          echo '  2. ${{ github.token }}'
          echo ""
          echo "=== WHAT GITHUB_TOKEN CANNOT DO ==="
          echo "  - Trigger other workflows (prevents recursive triggers)"
          echo "  - Access other repositories"
          echo "  - Manage repository settings"
          echo "  - Create/manage deploy keys"
          echo "  - Create/manage webhooks"
          echo "  - Manage team/org membership"
          echo "  - Push to protected branches (in most cases)"
          echo ""
          echo "=== WHEN TO USE A PAT OR GITHUB APP INSTEAD ==="
          echo "  - Cross-repo operations"
          echo "  - Triggering other workflows"
          echo "  - Admin-level operations"
          echo "  - Pushing to protected branches"

      - name: "Demonstrate token permissions"
        uses: actions/github-script@v7
        with:
          script: |
            // This works because we have 'issues: read' permission
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1,
              });
              console.log(`Can read issues: YES (found ${issues.data.length})`);
            } catch (e) {
              console.log(`Can read issues: NO (${e.message})`);
            }

            // This would FAIL because we only have 'issues: read', not write
            // Uncomment to test:
            // await github.rest.issues.create({
            //   owner: context.repo.owner,
            //   repo: context.repo.repo,
            //   title: 'Test issue',
            // });

  # ---------------------------------------------------------------------------
  # Job 2: Secret Precedence Demonstration
  # ---------------------------------------------------------------------------
  secret-precedence:
    name: "Secret Precedence Rules"
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-environment || 'development' }}

    steps:
      - name: "Explain secret precedence"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Secret Precedence Rules

          When the same secret name exists at multiple levels:

          ```
          Priority (highest to lowest):
          +-----------------------------+
          |  1. Environment Secrets     |  <-- Wins if environment is set
          |     (e.g., production)      |
          +-----------------------------+
          |  2. Repository Secrets      |  <-- Wins over org secrets
          |     (Settings > Secrets)    |
          +-----------------------------+
          |  3. Organization Secrets    |  <-- Lowest priority
          |     (Org Settings > Secrets)|
          +-----------------------------+
          ```

          ### Example Scenario

          If you have `API_KEY` set at all three levels:
          - Org secret `API_KEY` = `org-key-123`
          - Repo secret `API_KEY` = `repo-key-456`
          - Env secret `API_KEY` (production) = `prod-key-789`

          Then:
          - Job WITHOUT environment: `secrets.API_KEY` = `repo-key-456`
          - Job WITH environment `production`: `secrets.API_KEY` = `prod-key-789`

          ### Organization Secrets Visibility

          Org secrets can be scoped to:
          - **All repositories** in the organization
          - **Private repositories** only
          - **Selected repositories** (explicit list)

          ### Environment Protection Rules

          Environment secrets gain extra protection:
          - **Required reviewers**: Approve before secrets are exposed
          - **Wait timer**: Delay before deployment proceeds
          - **Deployment branches**: Only specific branches can access
          - **Custom rules**: Custom protection rules via GitHub Apps
          EOF

      - name: "Check secret availability patterns"
        run: |
          echo "=== Checking Secret Availability ==="

          # Pattern: Check if a secret exists without exposing it
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is set (value is masked)"
          else
            echo "MY_SECRET is NOT set at any level"
          fi

          # GITHUB_TOKEN is always available
          echo "GITHUB_TOKEN is available (always true)"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}

      - name: "Optional secret pattern"
        if: env.HAS_SECRET == 'true'
        run: |
          echo "Running with optional API key"
        env:
          HAS_SECRET: ${{ secrets.OPTIONAL_API_KEY != '' }}
          API_KEY: ${{ secrets.OPTIONAL_API_KEY }}

  # ---------------------------------------------------------------------------
  # Job 3: Environment Secrets with Protection Rules
  # ---------------------------------------------------------------------------
  environment-secrets:
    name: "Environment-Protected Secrets"
    runs-on: ubuntu-latest

    # The environment keyword does TWO things:
    # 1. Activates environment protection rules (reviewers, wait timer)
    # 2. Makes environment-level secrets available
    environment:
      name: ${{ inputs.target-environment || 'development' }}
      url: "https://${{ inputs.target-environment || 'dev' }}.example.com"

    steps:
      - name: "Show environment context"
        run: |
          echo "=== Environment Context ==="
          echo "Environment: ${{ inputs.target-environment || 'development' }}"
          echo ""
          echo "Secrets available at this point include:"
          echo "  - All organization secrets (if visible to this repo)"
          echo "  - All repository secrets"
          echo "  - All secrets from the '${{ inputs.target-environment || 'development' }}' environment"
          echo ""
          echo "If this environment has protection rules:"
          echo "  - A reviewer had to approve before this job started"
          echo "  - Any wait timer has already elapsed"
          echo "  - The current branch is in the allowed deployment branches"

      - name: "Deploy using environment secrets"
        run: |
          echo "Deploying to ${{ inputs.target-environment || 'development' }}..."
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}

  # ---------------------------------------------------------------------------
  # Job 4: Passing Secrets to Reusable Workflows
  # ---------------------------------------------------------------------------
  secrets-to-reusable:
    name: "Secrets in Reusable Workflows"
    runs-on: ubuntu-latest
    steps:
      - name: "Document reusable workflow secret patterns"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY_EOF'
          ## Passing Secrets to Reusable Workflows

          ### Method 1: Explicit Secret Passing
          ```yaml
          jobs:
            call-reusable:
              uses: org/repo/.github/workflows/deploy.yml@main
              with:
                environment: production
              secrets:
                deploy-token: ${{ secrets.DEPLOY_TOKEN }}
                api-key: ${{ secrets.API_KEY }}
          ```

          The reusable workflow must declare these:
          ```yaml
          on:
            workflow_call:
              secrets:
                deploy-token:
                  description: 'Token for deployment'
                  required: true
                api-key:
                  description: 'API key'
                  required: false
          ```

          ### Method 2: Inherit ALL Secrets
          ```yaml
          jobs:
            call-reusable:
              uses: org/repo/.github/workflows/deploy.yml@main
              with:
                environment: production
              secrets: inherit
          ```

          With `secrets: inherit`:
          - ALL repository secrets are passed through
          - ALL organization secrets (visible to the repo) are passed through
          - GITHUB_TOKEN is passed through with caller's permissions
          - The reusable workflow does NOT need to declare secrets

          ### Comparison Table

          | Approach | Pros | Cons |
          |----------|------|------|
          | **Explicit** | Principle of least privilege, clear contract | Verbose, must update both files |
          | **Inherit** | Simple, no secret declarations needed | Reusable workflow gets ALL secrets |

          ### Important Notes
          - `secrets: inherit` does NOT pass environment secrets
          - Environment secrets require the reusable workflow to specify `environment:`
          - GITHUB_TOKEN from `secrets: inherit` has the CALLER's permissions
          - Reusable workflows cannot access the caller's `vars` context via inherit
          SUMMARY_EOF

  # ---------------------------------------------------------------------------
  # Job 5: Secret Security Best Practices
  # ---------------------------------------------------------------------------
  secret-security:
    name: "Secret Security Practices"
    runs-on: ubuntu-latest
    steps:
      - name: "Demonstrate secret masking"
        run: |
          echo "=== SECRET MASKING ==="
          echo "Secrets are automatically masked in log output."
          echo "If you echo a secret, it shows as ***"
          echo ""
          echo "=== WAYS SECRETS CAN BE LEAKED ==="
          echo "1. Base64 encoding: echo secret | base64"
          echo "2. Character-by-character output"
          echo "3. Writing to a file and then catting it"
          echo "4. Sending to an external URL in a GET parameter"
          echo "5. Error messages that include the secret value"
          echo ""
          echo "=== CUSTOM MASKING ==="
          DYNAMIC_SECRET="generated-$(date +%s)"
          echo "::add-mask::${DYNAMIC_SECRET}"
          echo "Now this value is masked: ${DYNAMIC_SECRET}"

      - name: "Generate security best practices summary"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Secret Security Best Practices

          ### 1. Use Minimum Required Scope
          - Set `permissions` to the minimum needed
          - Prefer `read` over `write` when possible
          - Use per-job permissions, not workflow-level

          ### 2. Rotate Secrets Regularly
          - Set up a rotation schedule (90 days recommended)
          - Use GitHub Apps instead of long-lived PATs
          - GitHub App tokens expire in 1 hour automatically

          ### 3. Use Environment Protection
          - Production secrets should be in a protected environment
          - Require reviewer approval for production deployments
          - Restrict deployment branches to `main` only

          ### 4. Audit Secret Usage
          - Review the "Secrets" section in repository settings
          - Monitor Actions logs for unexpected secret access
          - Use `gh secret list` to inventory secrets

          ### 5. Never Hardcode Secrets
          - Use `${{ secrets.NAME }}` expression syntax
          - Never put secrets in workflow files, scripts, or code
          - Use `.env.example` files (never `.env` with real values)

          ### 6. Forked Repository Security
          - Secrets are NOT passed to workflows from forked PRs
          - `pull_request_target` CAN access secrets (dangerous!)
          - NEVER checkout and run untrusted code with `pull_request_target`

          ### 7. Secret Size and Count Limits
          | Scope | Max Secrets | Max Size Each |
          |-------|-------------|---------------|
          | Organization | 1,000 | 48 KB |
          | Repository | 1,000 | 48 KB |
          | Environment | 1,000 | 48 KB |

          ### 8. Configuration Variables (vars) vs Secrets
          Use `vars` for non-sensitive configuration:
          ```yaml
          env:
            API_URL: ${{ vars.API_URL }}          # Not sensitive - use vars
            API_KEY: ${{ secrets.API_KEY }}        # Sensitive - use secrets
          ```

          Variables (`vars`) are:
          - Visible in logs (not masked)
          - Available at org, repo, and environment levels
          - Same precedence rules as secrets (env > repo > org)
          - Good for: URLs, feature flags, version numbers
          EOF
